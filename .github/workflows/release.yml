name: Publish tagged release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish or update newest tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD)"
          fi

          git rev-parse "${tag}^{commit}" >/dev/null

          if [[ "${tag}" == "v2.6.4" ]]; then
            notes_file="$(mktemp)"
            cat >"${notes_file}" <<'EOF'
          ## What's new

          - Restored terminal command and output detection for newer Codex session formats.
          - Added support for current `CommandExecution` records while keeping older Codex session logs compatible.
          - Added Code Mode support so terminal activity wrapped through `exec` is exported correctly.
          - Prevented duplicate terminal entries when both wrapper and canonical execution records are present.
          - Improved tool classification so MCP calls and other Code Mode tools are exported to the correct sections instead of appearing as patches.
          - Improved tool-output parsing for newer structured output formats.
          EOF

            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release edit "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${tag}" \
                --notes-file "${notes_file}"
            else
              gh release create "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --verify-tag \
                --title "${tag}" \
                --notes-file "${notes_file}"
            fi
          elif ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "${tag}"
          else
            echo "Release ${tag} already exists."
          fi
