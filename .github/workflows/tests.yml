name: Session export regression tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional decompressor
        if: matrix.python-version == '3.11'
        run: python -m pip install backports.zstd
      - name: Compile source
        run: python -m py_compile codex-md.py
      - name: Run all regression and integration tests
        run: python -m unittest discover -v
